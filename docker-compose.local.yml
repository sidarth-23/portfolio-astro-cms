services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      PAYLOAD_SECRET: "changeme-local-dev"
      CMS_READ_TOKEN: "changeme-cms-read-token"
      PAYLOAD_PUBLIC_SERVER_URL: "http://localhost:3000"
      DATABASE_URI: "postgresql://postgres:postgres@postgres:5432/payload"
      S3_BUCKET: "sidshub-media"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      SITE_BUILD_HOOK_URL: ""
      SITE_BUILD_HOOK_SECRET: ""
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  minio_data:
