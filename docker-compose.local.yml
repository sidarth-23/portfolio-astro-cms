services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      PAYLOAD_SECRET: "changeme-local-dev"
      CMS_READ_TOKEN: "changeme-cms-read-token"
      PAYLOAD_PUBLIC_SERVER_URL: "http://localhost:3000"
      DATABASE_URI: "postgresql://postgres:postgres@postgres:5432/payload"
      S3_BUCKET: "sidshub-media"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      DOKPLOY_API_URL: ""
      DOKPLOY_API_KEY: ""
      DOKPLOY_APPLICATION_ID: ""
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

volumes:
  postgres_data:
  minio_data:
