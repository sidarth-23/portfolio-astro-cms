services:
  mongodb:
    image: mongo:7
    command: ["--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_CREATE_BUCKET_ON_STARTUP: ${MINIO_CREATE_BUCKET_ON_STARTUP:-true}
      S3_BUCKET: ${S3_BUCKET:-sidshub-media}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      if [ "$${MINIO_CREATE_BUCKET_ON_STARTUP}" != "true" ]; then
        echo "minio-init: bucket provisioning disabled; skipping";
        exit 0;
      fi;
      echo "minio-init: waiting for MinIO and ensuring bucket $${S3_BUCKET}";
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
        echo "minio-init: waiting for MinIO endpoint...";
        sleep 2;
      done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      echo "minio-init: bucket ready";
    restart: "no"

  payload-cms:
    image: ghcr.io/sidarth-g/sidshub-cms:${IMAGE_TAG:-main}
    env_file:
      - path: .env
        required: false
    environment:
      # Compose-determined values — always the same in this deployment topology.
      # These override anything set in .env.
      NODE_ENV: production
      DATABASE_URI: mongodb://mongodb:27017/payload
      S3_ENDPOINT: http://minio:9000
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  astro-web:
    image: ghcr.io/sidarth-g/sidshub-web:${IMAGE_TAG:-main}
    env_file:
      - path: .env
        required: false
    environment:
      # Compose-determined values — always the same in this deployment topology.
      HOST: "0.0.0.0"
      PORT: "4321"
    # NO depends_on — astro-web is fully independent of the CMS stack.
    # On first deployment the web image will not exist in GHCR yet (the web
    # build requires a seeded CMS). This service will fail to start until the
    # web image is published; that failure must never block the CMS from running.

volumes:
  mongodb_data:
  minio_data:
