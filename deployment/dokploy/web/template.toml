[variables]
web_domain = "${domain}"

[[config.domains]]
serviceName = "nginx"
port = 80
host = "${web_domain}"

[config.env]
# Web App (Astro) — these are Docker build args consumed during `docker compose build`.
# The read token is used at build time only (SSG page fetching) and never stored in
# the final image or published to any registry.
ASTRO_SITE_URL = "http://${web_domain}"

# Fill these after the CMS app is deployed.
# ASTRO_CMS_API_URL:    use the CMS app's domain, e.g. http://<cms_domain>/api
# ASTRO_CMS_READ_TOKEN: copy the value of CMS_READ_TOKEN from the CMS app's environment.
ASTRO_CMS_API_URL = ""
ASTRO_CMS_READ_TOKEN = ""
