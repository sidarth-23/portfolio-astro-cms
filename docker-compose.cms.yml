services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payload"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  payload-migrate:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    command: ["sh", "-c", "printf 'y\\n' | npm run migrate"]
    restart: "no"
    environment:
      NODE_ENV: "production"
      PAYLOAD_DB_PUSH: "false"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      DATABASE_URI: ${DATABASE_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      WEB_DEPLOY_WEBHOOK_URL: ${WEB_DEPLOY_WEBHOOK_URL}
      WEB_DEPLOY_BRANCH: ${WEB_DEPLOY_BRANCH}
    depends_on:
      postgres:
        condition: service_healthy

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    environment:
      NODE_ENV: "production"
      PAYLOAD_DB_PUSH: "false"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      DATABASE_URI: ${DATABASE_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      WEB_DEPLOY_WEBHOOK_URL: ${WEB_DEPLOY_WEBHOOK_URL}
      WEB_DEPLOY_BRANCH: ${WEB_DEPLOY_BRANCH}
    depends_on:
      payload-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

volumes:
  postgres_data:
  minio_data:
