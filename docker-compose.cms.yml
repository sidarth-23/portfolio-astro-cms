services:
  mongodb:
    image: mongo:7
    command: ["--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_CREATE_BUCKET_ON_STARTUP: ${MINIO_CREATE_BUCKET_ON_STARTUP:-false}
      S3_BUCKET: ${S3_BUCKET:-sidshub-media}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      if [ "$${MINIO_CREATE_BUCKET_ON_STARTUP}" != "true" ]; then
        echo "minio-init: bucket provisioning disabled; skipping";
        exit 0;
      fi;
      echo "minio-init: waiting for MinIO and ensuring bucket $${S3_BUCKET}";
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
        echo "minio-init: waiting for MinIO endpoint...";
        sleep 2;
      done;
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      echo "minio-init: bucket ready";
    restart: "no"

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        CMS_READ_TOKEN: ${CMS_READ_TOKEN}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
        DATABASE_URI: ${DATABASE_URI}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
        EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
        S3_BUCKET: ${S3_BUCKET}
        S3_REGION: ${S3_REGION}
        S3_ENDPOINT: ${S3_ENDPOINT}
        S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
        S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
        WEB_DEPLOY_WEBHOOK_URL: ${WEB_DEPLOY_WEBHOOK_URL}
        WEB_DEPLOY_BRANCH: ${WEB_DEPLOY_BRANCH}
        SITE_BUILD_HOOK_TYPE: ${SITE_BUILD_HOOK_TYPE}
        SITE_BUILD_HOOK_URL: ${SITE_BUILD_HOOK_URL}
        SITE_BUILD_HOOK_SECRET: ${SITE_BUILD_HOOK_SECRET}
        SITE_BUILD_HOOK_DOKPLOY_APP_ID: ${SITE_BUILD_HOOK_DOKPLOY_APP_ID}
        SITE_BUILD_HOOK_DOKPLOY_PROJECT_ID: ${SITE_BUILD_HOOK_DOKPLOY_PROJECT_ID}
    environment:
      NODE_ENV: "production"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      ASTRO_SITE_URL: ${ASTRO_SITE_URL}
      DATABASE_URI: ${DATABASE_URI}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      WEB_DEPLOY_WEBHOOK_URL: ${WEB_DEPLOY_WEBHOOK_URL}
      WEB_DEPLOY_BRANCH: ${WEB_DEPLOY_BRANCH}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

volumes:
  mongodb_data:
  minio_data:
