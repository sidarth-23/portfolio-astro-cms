include:
  - path: ./docker/services.yml

services:
  payload-cms:
    image: ghcr.io/sidarth-23/sidshub-cms:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URI: mongodb://mongodb:27017/payload
      S3_ENDPOINT: http://minio:9000
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      ASTRO_SITE_URL: ${ASTRO_SITE_URL}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      S3_BUCKET: ${S3_BUCKET:-sidshub-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      WEB_DEPLOY_WEBHOOK_URL: ${WEB_DEPLOY_WEBHOOK_URL:-}
      WEB_DEPLOY_BRANCH: ${WEB_DEPLOY_BRANCH:-main}
      WEB_DEPLOY_TYPE: ${WEB_DEPLOY_TYPE:-}
      WEB_DEPLOY_DOKPLOY_API_URL: ${WEB_DEPLOY_DOKPLOY_API_URL:-}
      WEB_DEPLOY_DOKPLOY_API_KEY: ${WEB_DEPLOY_DOKPLOY_API_KEY:-}
      WEB_DEPLOY_DOKPLOY_COMPOSE_ID: ${WEB_DEPLOY_DOKPLOY_COMPOSE_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  astro-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        ASTRO_SITE_URL: ${ASTRO_SITE_URL}
        ASTRO_CMS_API_URL: ${ASTRO_CMS_API_URL}
        ASTRO_CMS_READ_TOKEN: ${ASTRO_CMS_READ_TOKEN}
        CACHE_BUST: ${CACHE_BUST:-}
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      ASTRO_CMS_READ_TOKEN: ${ASTRO_CMS_READ_TOKEN}
    restart: unless-stopped
