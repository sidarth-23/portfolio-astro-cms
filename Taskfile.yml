version: "3"

vars:
  COMPOSE_FILE: docker-compose.local.yml
  POSTGRES_CONTAINER: portfolio-postgres-1

tasks:
  # Docker Compose Operations
  up:
    desc: Start local infrastructure (Postgres, MinIO)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d
      - task: minio:ensure-bucket

  up:build:
    desc: Build and start local infrastructure
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build
      - task: minio:ensure-bucket

  minio:ensure-bucket:
    desc: Ensure MinIO bucket exists for local media uploads
    cmds:
      - |
        set -e
        max_attempts=20
        attempt=1
        while [ "$attempt" -le "$max_attempts" ]; do
          if docker compose -f {{.COMPOSE_FILE}} run --rm minio-init; then
            echo "MinIO bucket is ready."
            exit 0
          fi

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "Failed to ensure MinIO bucket after ${max_attempts} attempts."
            exit 1
          fi

          echo "Bucket bootstrap attempt ${attempt}/${max_attempts} failed; retrying in 2s..."
          attempt=$((attempt + 1))
          sleep 2
        done

  down:
    desc: Stop all local services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  restart:
    desc: Restart all local services
    cmds:
      - task: down
      - task: up

  logs:
    desc: Follow logs from all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  logs:postgres:
    desc: Follow logs from Postgres
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f postgres

  logs:minio:
    desc: Follow logs from MinIO
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f minio

  clean:
    desc: "Stop services, remove volumes and clean local installed packages (WARNING: deletes all data)"
    prompt: This will delete all database and media data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v
      - rm -rf node_modules
      - rm -rf apps/cms/node_modules
      - rm -rf apps/web/node_modules
      - echo "Cleanup complete. Volumes and dependencies removed."

  # Database Operations
  db:reset:
    desc: Reset the database (drop and recreate)
    prompt: This will delete all database data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec postgres psql -U postgres -c "DROP DATABASE IF EXISTS payload;"
      - docker compose -f {{.COMPOSE_FILE}} exec postgres psql -U postgres -c "CREATE DATABASE payload;"
      - echo "Database reset complete."

  db:shell:
    desc: Open psql shell to the database
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec postgres psql -U postgres -d payload

  db:backup:
    desc: "Backup database to ./backups/payload-{timestamp}.sql"
    cmds:
      - mkdir -p backups
      - docker compose -f {{.COMPOSE_FILE}} exec -T postgres pg_dump -U postgres payload > backups/payload-$(date +%Y%m%d_%H%M%S).sql
      - echo "Backup created in backups/"

  db:restore:
    desc: "Restore database from backup (usage: task db:restore -- backups/payload-20260214.sql)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec -T postgres psql -U postgres payload < {{.CLI_ARGS}}
      - echo "Database restored from {{.CLI_ARGS}}"

  install:deps:
    desc: Install dependencies for all workspaces (bun install)
    cmds:
      - bun install

  install:
    desc: Quick reinstall of dependencies (without cleanup)
    cmds:
      - task: install:deps

  format:
    desc: Format code with Prettier
    cmds:
      - bunx prettier --write --plugin prettier-plugin-astro "apps/web/src/**/*.{astro,ts,tsx,js,mjs,css,md,mdx}"
      - bunx prettier --write "apps/cms/src/**/*.{ts,js}"

  # Complete Reset
  reset:
    desc: "Complete reset - cleanup, reinstall dependencies, start services"
    prompt: This will delete ALL data and dependencies, then rebuild everything. Continue?
    cmds:
      - task: clean
      - task: install:deps
      - task: up:build
      - echo "Reset complete. Services running - start apps with 'bun run dev'"
