version: "3"

vars:
  COMPOSE_FILE: docker-compose.yml

tasks:
  # Docker Compose Operations
  up:
    desc: Start local backing services (MongoDB, MinIO)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d mongodb minio minio-init

  up:services:
    desc: Start local backing services (MongoDB, MinIO)
    cmds:
      - task: up

  up:all:
    desc: Build and start the complete stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build

  up:build:
    desc: Build and start the complete stack
    cmds:
      - task: up:all

  minio:ensure-bucket:
    desc: Ensure MinIO bucket exists for media uploads
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm minio-init

  down:
    desc: Stop all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  restart:
    desc: Restart all services
    cmds:
      - task: down
      - task: up

  logs:
    desc: Follow logs from all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  logs:mongodb:
    desc: Follow logs from MongoDB
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f mongodb

  logs:minio:
    desc: Follow logs from MinIO
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f minio

  clean:
    desc: "Stop services, remove volumes and clean local installed packages (WARNING: deletes all data)"
    prompt: This will delete all database and media data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v
      - rm -rf node_modules
      - rm -rf apps/cms/node_modules
      - rm -rf apps/web/node_modules
      - echo "Cleanup complete. Volumes and dependencies removed."

  # Database Operations (MongoDB)
  db:reset:
    desc: Reset the payload database
    prompt: This will delete all database data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec mongodb mongosh --quiet --eval "db.getSiblingDB('payload').dropDatabase()"
      - echo "Database reset complete."

  db:shell:
    desc: Open Mongo shell to the payload database
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec mongodb mongosh payload

  db:backup:
    desc: "Backup payload database to ./backups/payload-{timestamp}.archive"
    cmds:
      - mkdir -p backups
      - docker compose -f {{.COMPOSE_FILE}} exec -T mongodb sh -lc "mongodump --db payload --archive" > backups/payload-$(date +%Y%m%d_%H%M%S).archive
      - echo "Backup created in backups/"

  db:restore:
    desc: "Restore database from backup (usage: task db:restore -- backups/payload-20260214.archive)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec -T mongodb sh -lc "mongorestore --drop --db payload --archive" < {{.CLI_ARGS}}
      - echo "Database restored from {{.CLI_ARGS}}"

  status:
    desc: Show service status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  install:deps:
    desc: Install dependencies for all workspaces (bun install)
    cmds:
      - bun install

  install:
    desc: Quick reinstall of dependencies (without cleanup)
    cmds:
      - task: install:deps

  format:
    desc: Format code with Prettier
    cmds:
      - bunx prettier --write --plugin prettier-plugin-astro "apps/web/src/**/*.{astro,ts,tsx,js,mjs,css,md,mdx}"
      - bunx prettier --write "apps/cms/src/**/*.{ts,js}"

  # Complete Reset
  reset:
    desc: "Complete reset - cleanup, reinstall dependencies, start services"
    prompt: This will delete ALL data and dependencies, then rebuild everything. Continue?
    cmds:
      - task: clean
      - task: install:deps
      - task: up:build
      - echo "Reset complete. Services running - start apps with 'bun run dev'"
