version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      NODE_ENV: "production"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      DATABASE_URI: ${DATABASE_URI}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DOKPLOY_API_URL: ${DOKPLOY_API_URL}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY}
      DOKPLOY_APPLICATION_ID: ${DOKPLOY_APPLICATION_ID}
    depends_on:
      - postgres
      - minio
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  astro-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ASTRO_SITE_URL: ${ASTRO_SITE_URL}
      ASTRO_CMS_API_URL: ${ASTRO_CMS_API_URL}
      ASTRO_CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      ASTRO_CMS_HEALTH_TIMEOUT_MS: ${ASTRO_CMS_HEALTH_TIMEOUT_MS:-5000}
      HOST: "0.0.0.0"
      PORT: "4321"
    depends_on:
      payload-cms:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
