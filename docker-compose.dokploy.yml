version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  payload-cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CMS_READ_TOKEN: ${CMS_READ_TOKEN}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      DATABASE_URI: ${DATABASE_URI}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SITE_BUILD_HOOK_URL: ${SITE_BUILD_HOOK_URL}
      SITE_BUILD_HOOK_SECRET: ${SITE_BUILD_HOOK_SECRET}
    depends_on:
      - postgres
      - minio

  astro-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ASTRO_CMS_API_URL: ${ASTRO_CMS_API_URL}
      ASTRO_CMS_READ_TOKEN: ${ASTRO_CMS_READ_TOKEN}
      ASTRO_CMS_HEALTH_TIMEOUT_MS: ${ASTRO_CMS_HEALTH_TIMEOUT_MS:-5000}
      HOST: "0.0.0.0"
      PORT: "4321"
    depends_on:
      - payload-cms

volumes:
  postgres_data:
  minio_data:
