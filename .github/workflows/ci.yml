name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/**/Dockerfile"
              - ".github/workflows/**"
            web:
              - "apps/web/**"
              - "packages/cms-core/**"
              - "packages/cms-lib-editor/**"
              - "packages/cms-lib-icons/**"
              - "packages/dev-config/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/web/Dockerfile"
              - ".github/workflows/**"
            cms:
              - "apps/cms/**"
              - "packages/cms-core/**"
              - "packages/cms-lib-editor/**"
              - "packages/cms-lib-icons/**"
              - "packages/cms-feature-emoji/**"
              - "packages/cms-feature-footnotes/**"
              - "packages/cms-feature-markdown-paste/**"
              - "packages/cms-plugin-deployment-log-view/**"
              - "packages/cms-plugin-og-image/**"
              - "packages/dev-config/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/cms/Dockerfile"
              - ".github/workflows/**"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-ci-${{ hashFiles('bun.lock', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-ci-

      - run: bun install --frozen-lockfile
      - run: bun run lint

  web-validation:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-web-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-
            ${{ runner.os }}-bun-ci-

      - run: bun install --frozen-lockfile
      - run: bun run check:web
      - run: bun run build:test:web

  cms-validation:
    needs: changes
    if: needs.changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-payload-secret
      CMS_READ_TOKEN: ci-cms-read-token
      PAYLOAD_PUBLIC_SERVER_URL: https://cms.example.com
      ASTRO_SITE_URL: https://www.example.com
      DATABASE_URI: mongodb://localhost:27017/payload
      RESEND_API_KEY: ci-resend-api-key
      EMAIL_FROM_ADDRESS: noreply@example.com
      EMAIL_FROM_NAME: Sid's Hub CI
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-cms-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'apps/cms/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-
            ${{ runner.os }}-bun-ci-

      - run: bun install --frozen-lockfile
      - run: bun run build:cms
