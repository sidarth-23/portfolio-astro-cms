name: Publish Images

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/cms-core/**"
              - "packages/cms-lib-editor/**"
              - "packages/cms-lib-icons/**"
              - "packages/dev-config/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/web/Dockerfile"
              - ".github/workflows/publish-images.yml"
            cms:
              - "apps/cms/**"
              - "packages/cms-core/**"
              - "packages/cms-lib-editor/**"
              - "packages/cms-lib-icons/**"
              - "packages/cms-feature-emoji/**"
              - "packages/cms-feature-footnotes/**"
              - "packages/cms-feature-markdown-paste/**"
              - "packages/cms-plugin-deployment-log-view/**"
              - "packages/cms-plugin-og-image/**"
              - "packages/dev-config/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/cms/Dockerfile"
              - ".github/workflows/publish-images.yml"

  publish-web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prep
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/sidshub-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache,mode=max
          build-args: |
            ASTRO_SITE_URL=${{ vars.ASTRO_SITE_URL }}
            ASTRO_CMS_API_URL=${{ vars.ASTRO_CMS_API_URL }}
            ASTRO_CMS_READ_TOKEN=${{ secrets.ASTRO_CMS_READ_TOKEN }}

  publish-cms:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prep
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/sidshub-cms" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache,mode=max
          build-args: |
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            PAYLOAD_PUBLIC_SERVER_URL=${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
            DATABASE_URI=${{ secrets.DATABASE_URI }}
            CMS_READ_TOKEN=${{ secrets.CMS_READ_TOKEN }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM_ADDRESS=${{ vars.EMAIL_FROM_ADDRESS }}
            EMAIL_FROM_NAME=${{ vars.EMAIL_FROM_NAME }}
            S3_BUCKET=${{ vars.S3_BUCKET }}
            S3_REGION=${{ vars.S3_REGION }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            WEB_DEPLOY_WEBHOOK_URL=${{ vars.WEB_DEPLOY_WEBHOOK_URL }}
            WEB_DEPLOY_BRANCH=${{ vars.WEB_DEPLOY_BRANCH }}
            SITE_BUILD_HOOK_TYPE=${{ vars.SITE_BUILD_HOOK_TYPE }}
            SITE_BUILD_HOOK_URL=${{ vars.SITE_BUILD_HOOK_URL }}
            SITE_BUILD_HOOK_SECRET=${{ secrets.SITE_BUILD_HOOK_SECRET }}
            SITE_BUILD_HOOK_DOKPLOY_APP_ID=${{ vars.SITE_BUILD_HOOK_DOKPLOY_APP_ID }}
            SITE_BUILD_HOOK_DOKPLOY_PROJECT_ID=${{ vars.SITE_BUILD_HOOK_DOKPLOY_PROJECT_ID }}
