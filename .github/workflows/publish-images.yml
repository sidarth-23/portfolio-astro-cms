name: Publish Images

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cms:
              - "apps/cms/**"
              - "packages/cms-core/**"
              - "packages/cms-lib-editor/**"
              - "packages/cms-lib-icons/**"
              - "packages/cms-feature-emoji/**"
              - "packages/cms-feature-footnotes/**"
              - "packages/cms-feature-markdown-paste/**"
              - "packages/cms-plugin-deployment-log-view/**"
              - "packages/cms-plugin-og-image/**"
              - "packages/dev-config/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - "apps/cms/Dockerfile"
              - ".github/workflows/publish-images.yml"

  publish-cms:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: prep
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/sidshub-cms" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image }}:buildcache,mode=max
